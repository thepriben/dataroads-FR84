name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot commits do not trigger push workflows. Publish even partial refreshes:
  # failed exports retain the previous cache while successful ones are committed.
  workflow_run:
    workflows: [Update OSM GeoJSON, Update OSM Latest Changes, Update External Data]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build user guide
        run: python3 scripts/build_guide.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

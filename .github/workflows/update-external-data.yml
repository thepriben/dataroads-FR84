name: Update External Data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python dependencies
        run: pip install pyshp pyproj
      - name: Update external data
        run: python3 scripts/update_external_data.py
        env:
          # Optional: official Waze for Cities partner feed. When set, the native
          # Waze layer is generated; otherwise the front-end uses the iframe fallback.
          WAZE_FEED_URL: ${{ secrets.WAZE_FEED_URL }}
      - name: Update natural zones and iNaturalist
        run: python3 scripts/update_natural_data.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/external; then
            echo "No external data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external
          git commit -m "Update external data"
          for attempt in 1 2 3; do
            # Regenerated data files: if the branch advanced meanwhile (overlapping
            # runs), let the newest generation win rather than aborting on content
            # conflicts. Clean up any half-finished rebase before retrying.
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

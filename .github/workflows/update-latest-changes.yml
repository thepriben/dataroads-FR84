name: Update OSM Latest Changes

# Toutes les heures : la couche n'a d'intérêt que si elle colle à l'actualité
# du terrain. L'augmented diff coûte une trentaine de secondes ici, ce qu'aucun
# visiteur ne doit attendre — c'est bien pour cela qu'il tourne en CI.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update latest changes
        run: python3 scripts/update_osm_latest_changes.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/osm/latest-changes.geojson; then
            echo "No change since last run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm/latest-changes.geojson
          git commit -m "Update OSM latest changes"
          for attempt in 1 2 3; do
            # Fichier régénéré d'un bloc : quand la branche a avancé entre-temps,
            # c'est la génération la plus récente qui doit gagner.
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

name: Update OSM GeoJSON

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update GeoJSON
        run: python3 scripts/update_osm_geojson.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/osm; then
            echo "No GeoJSON changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -m "Update OSM GeoJSON"
          for attempt in 1 2 3; do
            # These files are regenerated wholesale, so when the branch has
            # advanced meanwhile (e.g. the scheduled run and a manual dispatch
            # overlap) the newest generation must win. Rebase with -X theirs
            # resolves the inevitable content conflicts in our favour instead
            # of aborting; clean up any half-finished rebase before retrying.
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1

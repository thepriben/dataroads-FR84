name: Update OSM GeoJSON

on:
  workflow_dispatch:
    inputs:
      stale_only:
        description: "Ne reprendre que les jeux périmés"
        type: boolean
        default: false
  schedule:
    # Le rendez-vous est 2 h du matin, heure de France. Les crons de GitHub
    # Actions sont en UTC et ignorent les fuseaux : 2 h à Paris vaut 00:00 UTC
    # l'été (CEST) et 01:00 UTC l'hiver (CET). Un cron unique dériverait donc
    # d'une heure deux fois l'an. Les deux sont déclarés, et le travail « saison »
    # ci-dessous écarte celui qui ne correspond pas au décalage du jour.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    # Un 502 d'Overpass sur la requête la plus lourde laissait le réseau
    # départemental périmé jusqu'au rendez-vous suivant — onze jours la fois où
    # deux passages ont échoué d'affilée. Ce passage ne reprend que les jeux qui
    # ont manqué leur tour : une tentative par jour, jamais davantage, même si
    # Overpass reste durablement en panne.
    # Midi, et non deux heures après la nuit : un jeu que le passage nocturne
    # n'a pas su rapatrier n'atteint le seuil de péremption (trente heures) qu'en
    # fin de matinée, et attendre le milieu du jour laisse par ailleurs le temps
    # à un passage nocturne simplement retardé d'arriver avant — sans quoi le
    # rattrapage reprendrait les douze jeux que le passage complet s'apprête à
    # relire.
    - cron: "47 12 * * *"

permissions:
  contents: write

concurrency:
  group: osm-refresh
  cancel-in-progress: false

jobs:
  saison:
    runs-on: ubuntu-latest
    outputs:
      poursuivre: ${{ steps.verdict.outputs.poursuivre }}
    steps:
      - name: Décider si ce cron est celui de la saison
        id: verdict
        env:
          DECLENCHEUR: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          # Le verdict se prend sur le décalage horaire de Paris, jamais sur
          # l'heure qu'il est : GitHub retarde régulièrement un cron de plusieurs
          # heures — 03:17 parti à 08:23 sur ce dépôt. Un garde-fou du genre « ne
          # continuer que s'il est bien 2 h à Paris » ferait sauter ces passages
          # en silence, et c'est précisément la panne muette qu'on cherche à
          # éviter. Mieux vaut une extraction à 8 h que pas d'extraction.
          SAISONNIERS = {"0 0 * * *": True, "0 1 * * *": False}

          declencheur = os.environ.get("DECLENCHEUR", "")
          ete = datetime.now(ZoneInfo("Europe/Paris")).utcoffset() == timedelta(hours=2)
          # Le rattrapage et le déclenchement manuel ne visent pas une heure
          # locale : ils passent quelle que soit la saison.
          poursuivre = SAISONNIERS[declencheur] == ete if declencheur in SAISONNIERS else True
          print(f"poursuivre={'true' if poursuivre else 'false'}")
          PY

  update:
    needs: saison
    if: needs.saison.outputs.poursuivre == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update GeoJSON
        env:
          STALE_ONLY: ${{ github.event.schedule == '47 12 * * *' || inputs.stale_only }}
        run: |
          if [ "${STALE_ONLY}" = "true" ]; then
            python3 scripts/update_osm_geojson.py --stale-only
          else
            python3 scripts/update_osm_geojson.py
          fi
      - name: Rebuild territorial attribution
        # La table territoriale désigne les tronçons par leur identifiant OSM :
        # elle doit se recalculer dans la foulée de l'extraction, sinon un
        # tronçon redécoupé perdrait son secteur jusqu'au prochain passage.
        # Un rattrapage qui ne trouve rien à reprendre n'a rien redécoupé : la
        # recalculer quand même irait interroger DataSud et l'API Géo chaque
        # matin pour réécrire deux fichiers à l'identique.
        if: always()
        run: |
          if git diff --quiet -- data/osm; then
            echo "Aucun extrait modifié : table territoriale inchangée."
            exit 0
          fi
          python3 scripts/update_territorial_units.py
      - name: Commit changes
        # Un jeu refusé par Overpass fait échouer l'étape précédente, mais ce
        # qui a été rapatrié avant doit être publié quand même : le garder sur
        # le disque du runner ne servirait personne.
        if: always()
        run: |
          if git diff --quiet -- data/osm data/external/territorial-units.json data/external/territorial-boundaries.json; then
            echo "No GeoJSON changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm data/external/territorial-units.json data/external/territorial-boundaries.json
          git commit -m "Update OSM GeoJSON"
          for attempt in 1 2 3; do
            # These files are regenerated wholesale, so when the branch has
            # advanced meanwhile (e.g. the scheduled run and a manual dispatch
            # overlap) the newest generation must win. Rebase with -X theirs
            # resolves the inevitable content conflicts in our favour instead
            # of aborting; clean up any half-finished rebase before retrying.
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1
